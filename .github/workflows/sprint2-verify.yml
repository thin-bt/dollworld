name: Sprint2 competition verification

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.1'
          cache: npm
      - run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: UI009 targeted tests
        id: targeted
        continue-on-error: true
        run: npx vitest run apps/web/src/server/ui009.competition.test.ts apps/web/src/server/ui009/competition-round-robin-progress.test.ts 2>&1 | tee targeted-tests.log

      - name: Build
        id: build
        continue-on-error: true
        run: (npm run build -w @shared-world/simulation-core && npm run build -w @shared-world/web) 2>&1 | tee build.log

      - name: Verify Chrome test browser
        id: browser_install
        continue-on-error: true
        run: |
          set -o pipefail
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version) 2>&1 | tee browser-install.log

      - name: UI009 Chrome acceptance
        id: ui009_e2e
        continue-on-error: true
        run: npx playwright test tests/e2e/s2-ui009-round-robin-competition.spec.ts --project=chrome 2>&1 | tee ui009-e2e-chrome.log

      - name: Chrome E2E
        id: e2e
        continue-on-error: true
        run: npm run e2e:chrome 2>&1 | tee e2e-chrome.log

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-verification-${{ github.sha }}
          path: |
            typecheck.log
            targeted-tests.log
            build.log
            browser-install.log
            ui009-e2e-chrome.log
            e2e-chrome.log
          if-no-files-found: warn

      - name: Verification gate
        if: always()
        run: |
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.targeted.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.browser_install.outcome }}' = success
          test '${{ steps.ui009_e2e.outcome }}' = success
          test '${{ steps.e2e.outcome }}' = success
